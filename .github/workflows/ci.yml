name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # The prebuilt binary is compiled with an older Go than go.mod
          # targets and refuses to load the module. Build it with the Go
          # that setup-go installed instead.
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...
      # one iteration of every benchmark: they must keep compiling and running
      - run: make bench BENCHTIME=1x

  nocgo:
    # The library must still build and pass its tests without cgo; only raw SQL
    # routing is unavailable (see docs/BUILDING.md).
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported Postgres and a recent release.
        postgres: ["14", "18"]
    env:
      POSTGRES_VERSION: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start shards
        run: make up
      # includes the failure-injection tests and TestExamplesRun, which runs
      # every example and checks its key output lines
      - run: make test-integration-compose
      - run: make bench-integration BENCHTIME=1x
      - name: Stop shards
        if: always()
        run: make down

  demo:
    # docs/DEMO.md must stay true: this runs every command in it and compares
    # the output. It stops and starts a shard, so it has its own cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make demo-check
      - name: Stop shards
        if: always()
        run: make down
