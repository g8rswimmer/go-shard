run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - revive
    - misspell
    - gofmt
    - goimports
    - errorlint
    - bodyclose

issues:
  exclude-rules:
    # ShardID, ShardConfig, ShardError... are the domain's own terms and are
    # used in the docs and error messages; shard.ShardID reads fine.
    - linters: [revive]
      text: "stutters"
